<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Akira Mishima Ha Portfolio</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%20-45%20360%20360%22%3E%3Cstyle%3Epath%7Bfill%3A%23111%7D%40media%20(prefers-color-scheme%3Adark)%7Bpath%7Bfill%3A%23f3f3f1%7D%7D%3C%2Fstyle%3E%3Cpath%20d%3D%22M200%2C150L140%2C150L120%2C90L60%2C270L0%2C270L90%2C0L150%2C0ZM240%2C270L140%2C270L160%2C210L220%2C210ZM360%2C270L300%2C270L280%2C210L220%2C210L200%2C150L260%2C150L240%2C90L270%2C0Z%22%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap">
<style id="css">
/* Layout: a 12-column Swiss grid in one typeface and two neutrals. Hero: a statement, then the logo (cols 1-5) beside the name stacked in three lines (cols 6-12) on a hairline; hovering a name part morphs the logo. Work alternates 7/5 and full-width tiles (6/6 on tablets), or switches to a numbered index. */
:root{
  --bg:#F3F3F1;
  --surface:#E7E7E4;
  --ink:#111111;
  --muted:#6F6F6B;
  --line:#CDCDC9;
  --danger:#B3261E;
  --scrim:rgba(17,17,17,.4);
  --font:Futura,"Futura PT","Jost","Century Gothic","Avenir Next",sans-serif;
  --ease:cubic-bezier(.2,.7,.1,1);
  --gap:24px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E0E; --surface:#1B1B1B; --ink:#EDEDEA; --muted:#8D8D89; --line:#2C2C2C; --danger:#FF8A80; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E0E; --surface:#1B1B1B; --ink:#EDEDEA; --muted:#8D8D89; --line:#2C2C2C; --danger:#FF8A80; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}

html{scrollbar-gutter:stable}
html.locked{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.55 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:clip}
html.editing body{padding-bottom:140px}
[hidden]{display:none!important}
img{max-width:100%}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,p,dl,dd,ul,figure{margin:0}
h1,h2,h3{font-weight:500;text-wrap:balance}
ul{padding:0;list-style:none}
a{color:inherit}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:4px}
::selection{background:var(--ink);color:var(--bg)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:1440px;margin-inline:auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
@media (min-width:760px){.wrap{padding-left:max(40px, env(safe-area-inset-left,0px));padding-right:max(40px, env(safe-area-inset-right,0px))}}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap)}
.label{font-size:.72rem;line-height:1.3;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.label.ink{color:var(--ink)}
.hint{color:var(--muted);font-size:.92rem}
.num{font-variant-numeric:tabular-nums}

/* Buttons */
.btn{font:500 .72rem/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid var(--ink);padding:12px 16px 11px;cursor:pointer;transition:background .2s,color .2s,border-color .2s;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.3;pointer-events:none}
.btn.sm{padding:9px 12px 8px}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.solid:hover{background:transparent;color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:var(--bg)}
.btn.file{position:relative;overflow:hidden}
.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.btn.file:focus-within{outline:1.5px solid var(--ink);outline-offset:4px}
.tbtn{font:500 .72rem/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:none;border:0;padding:10px 0;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.tbtn:hover{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.tbtn:disabled{opacity:.3;pointer-events:none}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;padding-block:14px}
.brand{display:block;color:var(--ink);opacity:0;transform:translateY(6px);transition:opacity .45s var(--ease),transform .45s var(--ease)}
.topbar.brand-on .brand,.brand:focus-visible{opacity:1;transform:none}
.logo-sm{display:block;width:30px;height:22.5px;transform-origin:50% 60%}
.top-right{display:flex;align-items:center;gap:6px 22px;flex-wrap:wrap;justify-content:flex-end}
.nav{display:flex;gap:22px}
.theme{width:34px;height:34px;display:grid;place-items:center;background:none;border:0;color:var(--ink);cursor:pointer;padding:0}
.theme svg{width:18px;height:18px;transition:rotate .6s var(--ease)}
:root[data-theme="dark"] .theme svg{rotate:180deg}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .theme svg{rotate:180deg}}

/* Hero */
.hero{padding-block:clamp(48px,9vw,140px) clamp(72px,10vw,144px)}
.hero-lede{align-items:end;row-gap:20px;margin-bottom:clamp(48px,8vw,120px)}
.statement{grid-column:1 / 8;font-size:clamp(1.5rem,2.9vw,2.7rem);line-height:1.12;letter-spacing:-.02em;font-weight:400}
.status{grid-column:10 / 13;justify-self:end;text-align:right;display:flex;align-items:center;gap:10px}
.status::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
@media (max-width:820px){.statement{grid-column:1 / -1}.status{grid-column:1 / -1;justify-self:start;text-align:left}}
.hero-id{align-items:end;row-gap:28px}
.logo-big{grid-column:1 / 6;color:var(--ink)}
.logo-big svg{display:block;width:100%;height:auto;overflow:visible}
.names{grid-column:6 / 13;font-size:9vw;font-weight:500;line-height:.86;letter-spacing:-.045em;display:grid;justify-items:start;cursor:default;-webkit-user-select:none;user-select:none}
.nm{display:block;overflow:hidden;padding-block:.07em .02em;white-space:nowrap;transition:color .45s var(--ease)}
.names.hovering .nm:not(.on){color:var(--muted)}
.mark-in{display:inline-block}
.mark-in .ch{display:inline-block;white-space:pre}
@media (max-width:820px){.logo-big{grid-column:1 / 8}.names{grid-column:1 / -1}}
@media (min-width:821px){
  .hero-id{display:flex;justify-content:center;align-items:flex-end;gap:clamp(28px,3.4vw,64px)}
  .logo-big{flex:none;width:clamp(260px,31vw,480px)}
  .names{flex:0 1 auto;min-width:0}
}
.hero-base{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid var(--ink);padding-top:12px;margin-top:clamp(12px,1.6vw,20px)}
.hero-base a{text-decoration:none}
.hero-base a:hover{color:var(--ink)}

/* Section heads */
.band{padding-block:clamp(56px,8vw,112px)}
.head{align-items:end;row-gap:20px;padding-bottom:16px;border-bottom:1px solid var(--ink);margin-bottom:clamp(32px,5vw,56px)}
.head h2{grid-column:1 / 7;font-size:clamp(2rem,4.6vw,3.8rem);letter-spacing:-.035em;line-height:1}
.head h2 sup{font-size:.28em;letter-spacing:.06em;vertical-align:top;margin-left:.3em;color:var(--muted);font-weight:500;position:relative;top:.4em}
.ctrl{grid-column:7 / 13;display:flex;justify-content:flex-end;align-items:baseline;gap:10px 32px;flex-wrap:wrap}
@media (max-width:820px){.head h2,.ctrl{grid-column:1 / -1}.ctrl{justify-content:flex-start}}
.filters,.views{display:flex;flex-wrap:wrap;gap:4px 18px}
.views{padding-left:20px;border-left:1px solid var(--line)}
.fbtn{font:400 .95rem/1.2 var(--font);color:var(--muted);background:none;border:0;padding:4px 0;cursor:pointer;transition:color .2s}
.fbtn:hover{color:var(--ink)}
.fbtn[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.fbtn sup{font-size:.62em;margin-left:2px;letter-spacing:.04em}

/* Work grid */
#work-list{position:relative}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(48px,6vw,96px) var(--gap)}
.grid .cell{grid-column:1 / -1;display:grid;gap:12px;align-content:start;min-width:0}
.grid .s7{grid-column:span 7}
.grid .s5{grid-column:span 5}
.grid .s12{grid-column:span 12}
@media (max-width:1100px){.grid .s7,.grid .s5{grid-column:span 6}}
@media (max-width:640px){.grid .cell,.grid .s7,.grid .s5{grid-column:1 / -1}}
.card{display:grid;text-decoration:none;min-width:0}
.media{position:relative;overflow:hidden;background:var(--surface);height:clamp(240px,36vw,600px)}
.s12 .media{height:clamp(260px,44vw,720px)}
@media (max-width:640px){.media,.s12 .media{height:auto;aspect-ratio:4/3}}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.card:hover .media img{transform:scale(1.025)}
.media.broken img{display:none}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(22px,2.8vw,36px);
  --cm:var(--muted);
  background:
    linear-gradient(var(--cm),var(--cm)) left 8px top 18px / 10px 1px no-repeat,
    linear-gradient(var(--cm),var(--cm)) left 18px top 8px / 1px 10px no-repeat,
    linear-gradient(var(--cm),var(--cm)) right 8px top 18px / 10px 1px no-repeat,
    linear-gradient(var(--cm),var(--cm)) right 18px top 8px / 1px 10px no-repeat,
    linear-gradient(var(--cm),var(--cm)) left 8px bottom 18px / 10px 1px no-repeat,
    linear-gradient(var(--cm),var(--cm)) left 18px bottom 8px / 1px 10px no-repeat,
    linear-gradient(var(--cm),var(--cm)) right 8px bottom 18px / 10px 1px no-repeat,
    linear-gradient(var(--cm),var(--cm)) right 18px bottom 8px / 1px 10px no-repeat}
.ph-title{font-size:clamp(1.7rem,3.8vw,3.6rem);line-height:.98;letter-spacing:-.035em;font-weight:500;max-width:11ch;transition:transform .6s var(--ease);overflow-wrap:anywhere}
.card:hover .ph-title{transform:translateY(-8px)}
.cap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;padding-top:12px;min-width:0}
.cap .k{display:flex;gap:14px;min-width:0;flex:1 1 0}
.cap .k span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap .yr{flex:none}
.cap h3{flex-basis:100%;font-size:1.1rem;line-height:1.3;overflow-wrap:anywhere}
.card:hover .cap h3{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font:500 .66rem/1 var(--font);text-transform:uppercase;letter-spacing:.14em;padding:6px 8px 5px;border:1px solid var(--muted);color:var(--muted);margin-left:auto}
.add{display:grid;place-content:center;justify-items:center;gap:10px;height:140px;width:100%;border:1px dashed var(--muted);background:transparent;color:var(--ink);cursor:pointer;font:500 .72rem/1 var(--font);letter-spacing:.14em;text-transform:uppercase;transition:background .2s}
.add:hover{background:var(--surface)}
.add svg{width:28px;height:28px}
.empty{color:var(--muted);padding-block:24px}

/* Index view */
.index{border-top:1px solid var(--ink)}
.index .cell{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.irow{display:grid;grid-template-columns:3.4rem minmax(0,1fr) minmax(0,16rem) 5rem;gap:16px;align-items:baseline;padding-block:clamp(16px,2.2vw,26px);text-decoration:none;transition:opacity .35s}
.ititle{font-size:clamp(1.5rem,3.4vw,2.9rem);letter-spacing:-.03em;line-height:1.05;transition:transform .5s var(--ease);overflow-wrap:anywhere}
.irow:hover .ititle,.irow:focus-visible .ititle{transform:translateX(14px)}
.iyr{text-align:right}
@media (hover:hover){.index:hover .irow{opacity:.28}.index .irow:hover{opacity:1}}
@media (max-width:700px){.irow{grid-template-columns:2.4rem minmax(0,1fr) auto}.ikind{display:none}}
.index .add{height:84px}
.peek{position:fixed;left:0;top:0;z-index:30;width:min(340px,32vw);aspect-ratio:4/3;pointer-events:none;background:var(--surface);overflow:hidden;opacity:0;clip-path:inset(100% 0 0 0);transition:opacity .25s,clip-path .55s var(--ease)}
.peek.on{opacity:1;clip-path:inset(0 0 0 0)}
.peek img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.peek .ph-title{font-size:1.7rem}

/* About & contact */
.about-body{row-gap:40px}
.about-text{grid-column:5 / 11;display:grid;gap:20px}
.about-text p{max-width:58ch}
.about-text p:first-child{font-size:clamp(1.3rem,2.2vw,1.9rem);line-height:1.2;letter-spacing:-.015em;max-width:30ch}
.about-label{grid-column:1 / 4}
.clients{grid-column:5 / 13;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 var(--gap);border-top:1px solid var(--line)}
.clients li{padding-block:12px;border-bottom:1px solid var(--line)}
@media (max-width:820px){.about-text,.clients,.about-label{grid-column:1 / -1}}
.contact-body{display:grid;gap:clamp(20px,3vw,32px)}
.email{font-size:clamp(1.8rem,6.6vw,6.4rem);line-height:1;letter-spacing:-.04em;font-weight:500;overflow-wrap:anywhere;user-select:all;min-width:0}
.contact-row{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between;padding-top:16px;border-top:1px solid var(--line)}
.contact-row .note{color:var(--muted);max-width:52ch}
.footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;padding-block:24px 36px;border-top:1px solid var(--line)}
.footer a{text-decoration:none}

/* Project overlay */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg)}
.sheet{position:absolute;inset:0;overflow-y:auto;overflow-x:clip;overscroll-behavior:contain}
.veil{position:absolute;inset:0;z-index:5;background:var(--surface);opacity:0;pointer-events:none}
.sheet-bar{position:sticky;top:0;z-index:3;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.sheet-bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;padding-block:8px}
.sheet-bar .side{display:flex;gap:20px;align-items:center}
.d-body{display:grid;gap:clamp(44px,6vw,88px);padding-block:clamp(12px,2vw,24px) 24px}
.d-top{display:flex;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--ink)}
.d-title{font-size:clamp(2.6rem,8.4vw,8rem);letter-spacing:-.05em;line-height:.9;margin-top:clamp(18px,3vw,36px);overflow-wrap:anywhere}
.d-intro{margin-top:clamp(24px,3.4vw,44px);row-gap:20px}
.d-intro .lead{grid-column:5 / 13;font-size:clamp(1.3rem,2.4vw,2.1rem);line-height:1.18;letter-spacing:-.015em}
@media (max-width:820px){.d-intro .lead{grid-column:1 / -1}}
.d-cover{background:var(--surface)}
.d-cover img{display:block;width:100%;max-height:86vh;object-fit:cover}
.facts{row-gap:20px;padding-top:16px;border-top:1px solid var(--line)}
.facts div{grid-column:span 3;display:grid;gap:4px;min-width:0}
@media (max-width:700px){.facts div{grid-column:span 6}}
.story{display:grid;gap:clamp(28px,4vw,48px)}
.story section{row-gap:10px}
.story h3{grid-column:1 / 4}
.story p,.story dl{grid-column:5 / 11;font-size:1.12rem;line-height:1.6;max-width:62ch;white-space:pre-line}
@media (max-width:820px){.story h3,.story p,.story dl{grid-column:1 / -1}}
.story dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);white-space:normal;font-size:1rem;border-top:1px solid var(--line)}
.story dl div{display:contents}
.story dt,.story dd{padding-block:10px;border-bottom:1px solid var(--line)}
.story dt{color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(28px,4vw,48px) var(--gap)}
@media (max-width:640px){.gallery{grid-template-columns:minmax(0,1fr)}}
.gallery figure{display:grid;gap:10px;min-width:0}
.gallery figure:first-child{grid-column:1 / -1}
.gallery img,.gallery video{display:block;width:100%;height:auto;background:var(--surface)}
.d-next{display:grid;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--ink);color:var(--ink);padding:14px 0 clamp(48px,8vw,96px);cursor:pointer;font:inherit}
.d-next .nt{font-size:clamp(2.2rem,7vw,6.4rem);letter-spacing:-.045em;line-height:.95;transition:transform .6s var(--ease)}
.d-next:hover .nt{transform:translateX(18px)}

/* Edit bar */
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);color:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.editbar .wrap{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:12px}
.editbar .msg{flex:1 1 220px;min-width:0;display:grid;gap:3px}
.editbar .msg b{font-weight:500;font-size:1rem}
.editbar .msg span{font-size:.88rem;opacity:.65}
.editbar .btn{color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.editbar .btn:hover{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.editbar .btn.solid{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.editbar .btn.solid:hover{background:transparent;color:var(--bg)}
.editbar :focus-visible{outline-color:var(--bg)}

/* Editor */
.ed{position:fixed;inset:0;z-index:60}
.ed-scrim{position:absolute;inset:0;background:var(--scrim);transition:background .3s}
.ed.motion .ed-scrim,.ed.previewing .ed-scrim{background:transparent}
.ed-panel{position:absolute;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;border-left:1px solid var(--line);margin:0;box-shadow:-30px 0 60px -40px rgba(0,0,0,.5)}
.ed.motion .ed-panel{width:min(460px,100%)}
.ed-head,.ed-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-left:24px;padding-right:max(24px, env(safe-area-inset-right,0px))}
.ed-head{padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:16px;border-bottom:1px solid var(--ink)}
.ed-head h2{font-size:1.3rem;letter-spacing:-.01em;flex:1;min-width:0}
.ed-foot{padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.ed-foot .grow{flex:1}
.ed-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:28px max(24px, env(safe-area-inset-right,0px)) 40px 24px;display:grid;gap:40px;align-content:start}
.fs{display:grid;gap:16px;min-width:0}
.fs > h3{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;padding-bottom:10px;border-bottom:1px solid var(--line)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:16px}
.namerow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:end}
.field{display:grid;gap:6px;min-width:0}
.field > span{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.field small{color:var(--muted);font-size:.86rem}
.field input,.field textarea,.field select,.inline-input{width:100%;min-width:0;font:400 1rem/1.45 var(--font);color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0}
.field select{appearance:none;-webkit-appearance:none;padding-right:20px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:right 6px center,right 1px center;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.field select option{background:var(--bg);color:var(--ink)}
.field textarea{resize:vertical;border:1px solid var(--line);padding:10px 12px}
.field input:focus,.field textarea:focus,.field select:focus,.inline-input:focus{outline:none;border-color:var(--ink)}
.field input[type="range"]{border:0;padding:10px 0;accent-color:var(--ink);cursor:pointer}
.field input[aria-invalid="true"]{border-color:var(--danger)}
.check{display:flex;gap:10px;align-items:center;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--ink);margin:0}
.err{color:var(--danger);font-size:.9rem}
.cover-prev{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--surface);overflow:hidden;display:grid;place-items:center;color:var(--muted);text-align:center;padding:16px;font-size:.92rem}
.cover-prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gal-list{display:grid;gap:12px}
.gal-item{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px 14px;align-items:center}
.gal-item img,.gal-item video{width:72px;height:54px;object-fit:cover;background:var(--surface);display:block}
.gal-item .btnrow{grid-column:2}
.pathrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.mgroup{display:grid;gap:16px}
.mgroup > h4{margin:8px 0 0;font-size:1rem;font-weight:500}
.mrow{display:grid;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.mrow-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.mrow-head b{font-weight:500}
.row3{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.3fr);gap:12px;align-items:end}
@media (max-width:480px){.row3{grid-template-columns:1fr 1fr}.row3 .wide{grid-column:1 / -1}}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:80;transform:translate(-50%,12px);width:max-content;max-width:min(520px,calc(100% - 32px));background:var(--ink);color:var(--bg);padding:12px 16px;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
html.editing .toast{bottom:calc(110px + env(safe-area-inset-bottom,0px))}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

  } catch (e) { return file; }
}

    <div class="row2">${field('f-kind', 'Discipline', input('f-kind', p.kind, 'Visual identity'))}${field('f-year', 'Year', input('f-year', p.year, String(new Date().getFullYear())))}</div>
    <div class="row2">${field('f-client', 'Client', input('f-client', p.client))}${field('f-role', 'Your role', input('f-role', p.role))}${field('f-duration', 'Duration', input('f-duration', p.duration, '6 months'))}</div>
    ${field('f-tags', 'Filter tags', input('f-tags', (p.tags || []).join(', '), 'Identity, Print'), 'Separate with commas. Each tag becomes a filter above the projects.')}
  </section>
  <section class="fs"><h3>Images</h3><div id="media" class="fs"></div></section>
  <section class="fs"><h3>Story</h3>
    ${field('f-summary', 'Summary', area('f-summary', p.summary, 2), 'One or two sentences, shown at the top of the project.')}
    ${field('f-brief', 'The brief', area('f-brief', p.brief, 4, 'What was the problem?'))}
    ${field('f-approach', 'Approach', area('f-approach', p.approach, 5, 'What did you do, and why?'))}
    ${field('f-outcome', 'Outcome', area('f-outcome', p.outcome, 3, 'What changed?'))}
  </section>
  <section class="fs"><h3>Details</h3>
    ${field('f-specs', 'Details list', area('f-specs', (p.specs || []).map(([k, v]) => v ? `${k}: ${v}` : k).join('\n'), 5, 'Format: 230 × 300 mm\nPages: 160'), 'One per line, written as Label: value.')}
  </section>
  <section class="fs"><h3>Motion on this project page</h3>
    <label class="check" for="f-mcustom"><input type="checkbox" id="f-mcustom"${custom ? ' checked' : ''}> Give this project its own motion</label>
    <p class="hint">When this is off, the project uses the project-page settings in Motion. Play previews each part on this project’s page.</p>
    <div class="mgroup" id="pm-rows"${custom ? '' : ' hidden'}>${PROJECT_TARGETS.map(t => motionRow(t, 'pm', motion(t.k, p))).join('')}</div>
  </section>`;
}
function renderMedia(){
  const m = $('#media'); if (!m) return;
  const d = edDraft, can = canUpload();
  const pathRow = (id, act, ph) => LOCAL_EDIT ? `<div class="pathrow"><input class="inline-input" id="${id}" type="text" placeholder="${ph}" aria-label="${ph}"><button type="button" class="btn sm" data-media="${act}">Use</button></div>` : '';
  m.innerHTML = `
    <div class="field"><span>Cover image</span>
      <div class="cover-prev">${d.cover ? `<img src="${esc(src(d.cover))}" alt="Cover preview">` : 'No cover yet. The card shows a typographic placeholder instead.'}</div>
      ${can ? `<div class="btnrow"><label class="btn sm file">${d.cover ? 'Replace cover' : 'Upload cover'}<input type="file" id="f-cover" accept="${IMG_TYPES}"></label>${d.cover ? '<button type="button" class="btn sm" data-media="rm-cover">Remove cover</button>' : ''}</div>` : ''}
      ${pathRow('f-cover-path', 'cover-path', 'Or a path, e.g. images/cover.jpg')}
    </div>
    <div class="field"><span>Gallery</span>
      <div class="gal-list">${(d.gallery || []).map((g, i) => `<div class="gal-item">${g.kind === 'video' ? `<video src="${esc(src(g.id))}" muted></video>` : `<img src="${esc(src(g.id))}" alt="">`}
        <input class="inline-input" id="f-cap-${i}" data-cap="${i}" type="text" value="${esc(g.caption || '')}" placeholder="Caption" aria-label="Caption for item ${i + 1}">
        <div class="btnrow"><button type="button" class="btn sm" data-media="up" data-i="${i}" aria-label="Move item ${i + 1} earlier"${i === 0 ? ' disabled' : ''}>Move up</button><button type="button" class="btn sm" data-media="rm" data-i="${i}" aria-label="Remove item ${i + 1}">Remove</button></div>
      </div>`).join('') || '<p class="hint">No gallery images yet.</p>'}</div>
      ${can ? `<div class="btnrow"><label class="btn sm file">Add images or video<input type="file" id="f-gallery" accept="${IMG_TYPES},video/mp4,video/webm" multiple></label></div>` : ''}
      ${pathRow('f-gal-path', 'gal-path', 'Or a path, e.g. images/spread-01.jpg')}
    </div>
    <p class="hint" id="up-status" aria-live="polite">${!can ? 'Uploading images isn’t available in this view. Open the portfolio from your Claude artifacts to add them.'
      : LOCAL_EDIT ? 'Uploaded images are resized and stored inside the HTML file. For big videos, put the file next to the HTML and enter its path instead.'
      : 'Large photos are resized to 2400 px before upload.'}</p>`;
}
function siteForm(s){
  const parts = nameParts(), map = logoMap();
  const p3 = parts.length >= 3 ? parts : parts.length === 2 ? [parts[0], '', parts[1]] : ['', parts[0], ''];
  const shapes = [['A','A'],['M','M'],['H','H']];
  const nrow = (role, label, v) => `<div class="namerow">${field(`s-f-${role}`, label, input(`s-f-${role}`, v))}${field(`s-f-${role}-shape`, 'Logo on hover', select(`s-f-${role}-shape`, shapes, map[role]))}</div>`;
  return `
  <section class="fs"><h3>Name and logo</h3>
    <p class="hint">Your name is set beside the logo. Hovering each part reshapes the logo into the letter you choose; anywhere else it returns to M.</p>
    ${nrow('first', 'First name', p3[0])}
    ${nrow('middle', 'Middle name', p3[1])}
    ${nrow('last', 'Last name', p3[2])}
  </section>
  <section class="fs"><h3>Hero</h3>
    ${field('s-f-eyebrow', 'Role', input('s-f-eyebrow', s.eyebrow, 'Graphic designer'))}
    ${field('s-f-headline', 'Statement', area('s-f-headline', s.headline, 2))}
    ${field('s-f-status', 'Availability', input('s-f-status', s.status, 'Available from March'), 'Leave empty to hide it.')}
  </section>
  <section class="fs"><h3>About</h3>
    ${field('s-f-line', 'Practice', input('s-f-line', s.line, 'Identity, editorial and type'))}
    ${field('s-f-about', 'About text', area('s-f-about', (s.about || []).join('\n\n'), 7), 'Leave a blank line between paragraphs. The first one is set larger.')}
    ${field('s-f-clients', 'Clients', area('s-f-clients', (s.clients || []).join('\n'), 5), 'One per line.')}
  </section>
  <section class="fs"><h3>Contact</h3>
    ${field('s-f-email', 'Email', input('s-f-email', s.email, 'you@example.com'))}
    ${field('s-f-note', 'Contact note', area('s-f-note', s.note, 2))}
  </section>`;
}
function motionForm(){
  const ms = motionState();
  const group = (g, title, hint) => `<div class="mgroup"><h4>${title}</h4>${hint ? `<p class="hint">${hint}</p>` : ''}${TARGETS.filter(t => t.group === g).map(t => motionRow(t, 'm', motion(t.k))).join('')}</div>`;
  return `
  <section class="fs"><h3>Hero motion</h3>
    ${field('m-loop', 'After the hero appears', select('m-loop', [['none','Logo changes only on hover'],['cycle','Logo cycles through each name'],['parallax','Logo and name drift as you scroll']], ms.loop))}
  </section>
  <section class="fs"><h3>How things appear</h3>
    <p class="hint">Anything already on screen plays when the page loads. Everything else plays as it scrolls into view. Changes apply right away.</p>
    ${group('hero', 'Hero')}
    ${group('page', 'Page')}
    ${group('project', 'Project pages', 'Used by every project unless it has its own motion. Play opens a project behind this panel.')}
    <div class="btnrow"><button type="button" class="btn sm" id="m-replay">Replay the hero</button><button type="button" class="btn sm" id="m-reset">Reset to defaults</button></div>
  </section>`;
}
let delArmed = false, lastFocus = null;
function showEditor(){
  ed.hidden = false; lockPage(true); overlay.inert = true;
  ed.classList.toggle('motion', edMode === 'motion');
  $('#ed-body').scrollTop = 0;
  if (canAnim()) { $('.ed-panel', ed).animate([{ transform:'translateX(48px)', opacity:0 }, { transform:'none', opacity:1 }], { duration:560, easing:EXPO }); if (edMode !== 'motion') $('.ed-scrim', ed).animate([{ opacity:0 }, { opacity:1 }], { duration:300 }); }
  setTimeout(() => $('#ed-body input, #ed-body select')?.focus({ preventScroll:true }), 30);
}
function setEditorChrome(title, save, del, cancel = true){
  $('#ed-h').textContent = title; $('#ed-save').textContent = save;
  $('#ed-delete').hidden = !del; $('#ed-cancel').hidden = !cancel;
  delArmed = false; $('#ed-delete').textContent = 'Delete project';
}
function openEditor(id){
  lastFocus = document.activeElement;
  const p = id ? state.projects.find(x => x.id === id) : null;
  edMode = 'project'; edIsNew = !p;
  edDraft = p ? JSON.parse(JSON.stringify(p)) : { id:'', title:'', kind:'', year:String(new Date().getFullYear()), client:'', role:'', duration:'', tags:[], summary:'', brief:'', approach:'', outcome:'', specs:[], cover:null, gallery:[] };
  setEditorChrome(p ? `Edit ${p.title || 'project'}` : 'Add a project', p ? 'Save changes' : 'Add project', !!p);
  $('#ed-body').innerHTML = projectForm(edDraft);
  renderMedia(); showEditor();
}
function openSiteEditor(){
  lastFocus = document.activeElement; edMode = 'site';
  setEditorChrome('Site details', 'Save changes', false);
  $('#ed-body').innerHTML = siteForm(state.site);
  showEditor();
}
function openMotionEditor(){
  lastFocus = document.activeElement; edMode = 'motion';
  setEditorChrome('Motion', 'Done', false, false);
  $('#ed-body').innerHTML = motionForm();
  showEditor();
}
function hidePreview(){
  if (!previewOpen) return;
  overlay.hidden = true; previewOpen = false; currentId = null; dBody.innerHTML = ''; sweepArmed();
  ed.classList.remove('previewing');
}
function closeEditor(){
  hidePreview();
  ed.hidden = true; overlay.inert = false; ed.classList.remove('motion', 'previewing');
  if (overlay.hidden) lockPage(false); else page.inert = true;
  edMode = null;
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll:true });
}

/* Motion previews */
function setMotion(k, key, val){
  const m = state.site.motion = { loop:motionState().loop, items:{ ...motionState().items } };
  m.items[k] = { ...motion(k), [key]:val };
  saveDraft(); updateBar();
}
function setProjMotion(k, key, val){
  const pm = edDraft.motion || (edDraft.motion = { custom:true, items:{} });
  pm.items = pm.items || {};
  pm.items[k] = { ...motion(k, edDraft), [key]:val };
}
/* Show a project page behind the editor so its parts can be previewed. */
function previewDetail(p){
  if (!overlay.hidden && currentId === p.id) return;
  dBody.innerHTML = detailHTML(p, navList());
  currentId = p.id; overlay.hidden = false; previewOpen = true; sheet.scrollTop = 0;
  ed.classList.add('previewing');
  sweepArmed();
}
function playTarget(k, proj){
  const t = TDEF[k]; if (!t || !t.sel) return;
  if (!canAnim()) { toast('Your system is set to reduce motion, so animations are switched off.'); return; }
  if (t.group === 'project') {
    const p = proj || state.projects.find(x => x.id === currentId) || visible()[0] || state.projects[0];
    if (!p) { toast('Add a project first to preview project pages.'); return; }
    previewDetail(p);
    const els = $$(t.sel, dBody);
    if (!els.length) { toast(`This project has no ${t.label.toLowerCase()} yet.`); return; }
    els[0].scrollIntoView({ block:'center' });
    requestAnimationFrame(() => { let n = 0; els.forEach(el => { disarm(el); if (inViewport(el)) run(el, k, t.stagger ? (n++) * 90 : 0, false, p); }); });
  } else {
    hidePreview();
    const els = $$(t.sel); if (!els.length) return;
    if (!inViewport(els[0])) els[0].scrollIntoView({ block:'center' });
    requestAnimationFrame(() => { let n = 0; els.forEach(el => { disarm(el); if (inViewport(el)) run(el, k, t.stagger ? (n++) * 90 : 0); }); });
  }
  if (motion(k, proj).fx === 'none') toast('This part is set to no animation.');
}
function replayHero(){
  hidePreview(); scrollTo(0, 0);
  requestAnimationFrame(() => ['header','logo','name','statement','heroBase'].forEach(k => { const el = $(TDEF[k].sel); disarm(el); run(el, k); }));
}
ed.addEventListener('click', e => {
  if (e.target.closest('[data-ed-cancel]')) return closeEditor();
  const pl = e.target.closest('[data-play]');
  if (pl) return playTarget(pl.dataset.play, pl.dataset.scope === 'pm' ? edDraft : null);
  if (e.target.id === 'm-replay') return replayHero();
  if (e.target.id === 'm-reset') {
    state.site.motion = { loop:'none', items:{} }; saveDraft(); updateBar(); applyLoop();
    $('#ed-body').innerHTML = motionForm(); replayHero(); toast('Motion reset to the defaults.'); return;
  }
  const m = e.target.closest('[data-media]'); if (!m) return;
  const i = Number(m.dataset.i), g = edDraft.gallery;
  const a = m.dataset.media;
  if (a === 'rm-cover') edDraft.cover = null;
  else if (a === 'rm') g.splice(i, 1);
  else if (a === 'up' && i > 0) [g[i - 1], g[i]] = [g[i], g[i - 1]];
  else if (a === 'cover-path') { const v = $('#f-cover-path').value.trim(); if (v) edDraft.cover = v; }
  else if (a === 'gal-path') { const v = $('#f-gal-path').value.trim(); if (v) g.push({ id:v, kind:/\.(mp4|webm|mov)$/i.test(v) ? 'video' : 'image', caption:'' }); }
  renderMedia();
});
ed.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.cap !== undefined) { edDraft.gallery[Number(t.dataset.cap)].caption = t.value; return; }
  if (t.id === 'f-title') { t.removeAttribute('aria-invalid'); $('#f-title-err').hidden = true; }
  const md = t.id.match(/^(m|pm)-(\w+)-delay$/);
  if (md) {
    $(`#${md[1]}-${md[2]}-out`).textContent = `${t.value} ms`;
    if (md[1] === 'm') setMotion(md[2], 'delay', Number(t.value)); else setProjMotion(md[2], 'delay', Number(t.value));
  }
});
ed.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'm-loop') {
    state.site.motion = { loop:t.value, items:{ ...motionState().items } }; saveDraft(); updateBar();
    hidePreview(); applyLoop(); return;
  }
  if (t.id === 'f-mcustom') {
    if (t.checked) edDraft.motion = { custom:true, items:Object.fromEntries(PROJECT_TARGETS.map(x => [x.k, motion(x.k, edDraft)])) };
    else if (edDraft.motion) edDraft.motion.custom = false;
    $('#pm-rows').hidden = !t.checked; return;
  }
  const mm = t.id.match(/^(m|pm)-(\w+)-(fx|speed|delay)$/);
  if (mm) {
    const [, scope, k, f] = mm;
    if (f !== 'delay') { if (scope === 'm') setMotion(k, f, t.value); else setProjMotion(k, f, t.value); }
    playTarget(k, scope === 'pm' ? edDraft : null);
    return;
  }
  if (t.id !== 'f-cover' && t.id !== 'f-gallery') return;
  const files = [...(t.files || [])]; if (!files.length || !canUpload()) return;
  const status = $('#up-status'), save = $('#ed-save');
  save.disabled = true;
  try {
    for (let k = 0; k < files.length; k++) {
      status.textContent = `${assetsNs ? 'Uploading' : 'Adding'} ${files.length > 1 ? `${k + 1} of ${files.length}` : files[k].name}…`;
      if (t.id === 'f-cover' && /^video\//.test(files[k].type)) throw { code:'unsupported_type' };
      const r = await uploadFile(files[k]);
      if (t.id === 'f-cover') edDraft.cover = r.id;
      else edDraft.gallery.push({ id:r.id, kind:r.kind, caption:'' });
    }
    renderMedia(); $('#up-status').textContent = files.length > 1 ? `${files.length} files added.` : 'Added.';
  } catch (err) { renderMedia(); $('#up-status').textContent = uploadError(err); }
  finally { save.disabled = false; }
});
function slugify(s){ return (s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'project'; }
function uniqueId(base){ let id = base, n = 2; while (state.projects.some(p => p.id === id)) id = `${base}-${n++}`; return id; }
$('#ed-form').addEventListener('submit', e => {
  e.preventDefault();
  if (edMode === 'motion') { closeEditor(); return; }
  const v = id => $('#' + id).value.trim();
  if (edMode === 'site') {
    const parts = ['first','middle','last'].map(r => v(`s-f-${r}`));
    const shapes = Object.fromEntries(['first','middle','last'].map(r => [r, v(`s-f-${r}-shape`)]));
    const s = { ...state.site, nameParts:parts, name:parts.filter(Boolean).join(' '), logoMap:shapes, line:v('s-f-line'), eyebrow:v('s-f-eyebrow'), headline:v('s-f-headline'), status:v('s-f-status'),
      about:v('s-f-about').split(/\n\s*\n/).map(x => x.trim()).filter(Boolean), clients:v('s-f-clients').split('\n').map(x => x.trim()).filter(Boolean),
      email:v('s-f-email'), note:v('s-f-note') };
    if (JSON.stringify(s) !== JSON.stringify(state.site)) { delete s.example; state.site = s; }
    closeEditor(); changed(); toast(LOCAL_EDIT ? 'Site details updated. Save when you’re ready.' : 'Site details saved. Publish when you’re ready.');
    return;
  }
  const d = edDraft;
  d.title = v('f-title');
  if (!d.title) { $('#f-title').setAttribute('aria-invalid','true'); $('#f-title-err').hidden = false; $('#f-title').focus(); return; }
  Object.assign(d, { kind:v('f-kind'), year:v('f-year'), client:v('f-client'), role:v('f-role'), duration:v('f-duration'),
    tags:[...new Set(v('f-tags').split(',').map(x => x.trim()).filter(Boolean))], summary:v('f-summary'), brief:v('f-brief'), approach:v('f-approach'), outcome:v('f-outcome'),
    specs:v('f-specs').split('\n').map(l => { const k = l.indexOf(':'); return k < 0 ? [l.trim(), ''] : [l.slice(0, k).trim(), l.slice(k + 1).trim()]; }).filter(([a, b]) => a || b) });
  delete d.sign; delete d.palette;
  if (!$('#f-mcustom').checked) delete d.motion;
  const orig = state.projects.find(p => p.id === d.id);
  if (orig && JSON.stringify(orig) !== JSON.stringify(d)) delete d.example;
  if (edIsNew) { d.id = uniqueId(slugify(d.title)); delete d.example; state.projects.push(d); if (filter !== 'All' && !d.tags.includes(filter)) filter = 'All'; }
  else state.projects[state.projects.indexOf(orig)] = d;
  closeEditor(); changed();
  const verb = LOCAL_EDIT ? 'Save' : 'Publish';
  toast(edIsNew ? `${d.title} added. ${verb} when you’re ready.` : `Updated. ${verb} when you’re ready.`);
  if (edIsNew) setTimeout(() => $(`.cell[data-id="${CSS.escape(d.id)}"]`, list)?.scrollIntoView({ behavior:canAnim() ? 'smooth' : 'auto', block:'center' }), 60);
});
$('#ed-delete').addEventListener('click', () => {
  const b = $('#ed-delete');
  if (!delArmed) { delArmed = true; b.textContent = 'Click again to delete'; setTimeout(() => { if (delArmed) { delArmed = false; b.textContent = 'Delete project'; } }, 3500); return; }
  const id = edDraft.id, title = edDraft.title;
  state.projects = state.projects.filter(p => p.id !== id);
  closeEditor();
  if (!overlay.hidden && currentId === id) closeDetail(true);
  changed(); toast(`${title || 'Project'} deleted. ${LOCAL_EDIT ? 'Save' : 'Publish'} to remove it for good.`);
});

/* ---------- Boot ---------- */
renderSite(); renderFilters(); renderWork(); applyLoop();
['header','logo','name','statement','heroBase'].forEach(k => reveal($(TDEF[k].sel), k));
$$('.head').forEach(h => reveal(h, 'heads'));
reveal($('.about-text'), 'about'); reveal($('#s-clients'), 'clients'); reveal($('.contact-body'), 'contact'); reveal($('.footer'), 'footer');
const startId = decodeURIComponent(location.hash.slice(1));
if (state.projects.some(p => p.id === startId)) openDetail(startId, null);

function enableEditing(){
  $('#edit-toggle').hidden = false;
  $('#eb-publish').textContent = LOCAL_EDIT ? 'Save file' : 'Publish';
  const d = ls.get(DRAFT_KEY);
  if (ss.get(EDIT_KEY) === '1' || (d && d !== PUB_STR)) setEditing(true);
  else if (d === PUB_STR) ls.del(DRAFT_KEY);
}
const use = n => IN_CLAUDE ? Promise.resolve(window.claude.use(n)).catch(() => null) : Promise.resolve(null);
if (LOCAL_EDIT) enableEditing();
else if (IN_CLAUDE) Promise.all([use('artifact'), use('user'), use('assets')]).then(async ([a, u, as]) => {
  if (!a) return;
  let can = false;
  try { can = u ? await u.canEdit() : true; } catch (e) { can = false; }
  if (!can) return;
  artNs = a; assetsNs = as;
  $('#eb-download').hidden = false;
  enableEditing();
});
})();
</script>
</body>
